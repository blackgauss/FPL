[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpl"
version = "0.1.0"
description = "Fantasy Premier League ML system"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "tdigest>=0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
notebook = [
    "ipykernel>=6.0",
    "nbformat>=5.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fpl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# CSV data literals mirror the wide upstream headers
"tests/fixtures/synthetic.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "httpx>=0.28.1",
]
