# DVC pipeline — data + model core, wired from the existing recipes.
#
# Stages:
#   ingest            (side-effect: parquet in data/processed; no outs)
#   features      -> features_{season}.parquet
#   train         -> points_lgbm.txt + mae.json (metrics)
#   fit_dist      -> dist_{season}.parquet
#   eval_experiments -> ranking_exp.metrics.json (metrics)
#   rank_report   -> ranking.metrics.json (metrics) + report
#
# `dvc repro` runs only outdated stages; `dvc dag` renders the graph;
# `dvc metrics show` reads the metrics each stage emits. Full result
# documents stay git-tracked; metric files are DVC-managed outputs.

vars:
  - params.yaml

stages:
  ingest:
    cmd: >-
      uv run python -m fpl.stages.ingest --config config/data.yaml
    deps:
      - config/data.yaml
      - external/fpl_core/data
      - src/fpl

  features:
    cmd: >-
      uv run python -m fpl.stages.features --config config/data.yaml
      --season ${pipeline.season}
    params:
      - pipeline.season
    deps:
      - config/data.yaml
      - data/processed/players_${pipeline.season}.parquet
      - data/processed/gw_stats_${pipeline.season}.parquet
      - data/processed/team_history_${pipeline.season}.parquet
      - data/processed/matches_${pipeline.season}.parquet
      - src/fpl
    outs:
      - data/processed/features_${pipeline.season}.parquet

  train:
    cmd: uv run python -m fpl.stages.train
    deps:
      - data/processed/features_2024-2025.parquet
      - data/processed/features_${pipeline.season}.parquet
      - data/processed/players_2024-2025.parquet
      - data/processed/players_${pipeline.season}.parquet
      - src/fpl
    outs:
      - data/processed/points_lgbm.txt
    metrics:
      - data/processed/mae.json

  fit_dist:
    cmd: >-
      uv run python -m fpl.stages.fit_dist --processed data/processed
      --season ${pipeline.season} --gw ${pipeline.gw_start}
      --gw-end ${pipeline.gw_end} --fit-gw-max ${pipeline.fit_gw_max}
    params:
      - pipeline.season
      - pipeline.gw_start
      - pipeline.gw_end
      - pipeline.fit_gw_max
    deps:
      - data/processed/points_lgbm.txt
      - data/processed/features_${pipeline.season}.parquet
      - data/processed/players_${pipeline.season}.parquet
      - src/fpl
    outs:
      - data/processed/dist_${pipeline.season}.parquet

  eval_experiments:
    cmd: >-
      uv run python -m fpl.stages.experiments
      --config config/experiments_ranking.yaml
      --output experiments/artifacts/ranking_exp.json
      --metrics-out experiments/artifacts/ranking_exp.metrics.json
      --parallel ${pipeline.experiments.parallel}
      --cache-dir experiments/artifacts/.cache
    params:
      - pipeline.experiments.parallel
    deps:
      - config/experiments_ranking.yaml
      - data/processed/features_2024-2025.parquet
      - data/processed/features_${pipeline.season}.parquet
      - data/processed/players_2024-2025.parquet
      - data/processed/players_${pipeline.season}.parquet
      - src/fpl
    metrics:
      - experiments/artifacts/ranking_exp.metrics.json

  rank_report:
    cmd: >-
      uv run python -m fpl.stages.ranking
    params:
      - pipeline.season
    deps:
      - config/experiments_ranking.yaml
      - data/processed/features_${pipeline.season}.parquet
      - data/processed/players_${pipeline.season}.parquet
      - src/fpl
    metrics:
      - experiments/artifacts/ranking.metrics.json

  search:
    cmd: >-
      uv run python -m fpl search --season ${pipeline.season}
      --gw ${pipeline.gw_start} --gw-end ${pipeline.gw_end}
      --enum ${pipeline.search.enum} --value ${pipeline.search.value}
      --n-teams ${pipeline.search.n_teams} --seed ${pipeline.search.seed}
      --n-samples ${pipeline.search.n_samples}
      --out data/processed/search_candidates.parquet
      --metrics-out experiments/artifacts/search.metrics.json
    params:
      - pipeline.season
      - pipeline.gw_start
      - pipeline.gw_end
      - pipeline.search
    deps:
      - data/processed/points_lgbm.txt
      - data/processed/features_${pipeline.season}.parquet
      - data/processed/players_${pipeline.season}.parquet
      - data/processed/gw_stats_${pipeline.season}.parquet
      - src/fpl
    outs:
      - data/processed/search_candidates.parquet
    metrics:
      - experiments/artifacts/search.metrics.json

  gym:
    cmd: >-
      uv run python -m fpl gym --season ${pipeline.season}
      --gw ${pipeline.gw_start} --gw-end ${pipeline.gw_end}
      --top ${pipeline.gym.top} --candidates data/processed/search_candidates.parquet
      --out experiments/artifacts/gym.json
      --metrics-out experiments/artifacts/gym.metrics.json
    params:
      - pipeline.season
      - pipeline.gw_start
      - pipeline.gw_end
      - pipeline.gym.top
    deps:
      - data/processed/search_candidates.parquet
      - data/processed/points_lgbm.txt
      - data/processed/features_${pipeline.season}.parquet
      - data/processed/players_${pipeline.season}.parquet
      - data/processed/gw_stats_${pipeline.season}.parquet
      - src/fpl
    outs:
      - experiments/artifacts/gym.json
    metrics:
      - experiments/artifacts/gym.metrics.json
