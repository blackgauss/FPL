# Rapid-experiment registry: run candidates on the same held-out slice.
# Each experiment: model (registry name), features (feature-store subset),
# split: explicit source-GW windows (see fpl.experiments.splits).

seasons: ["2024-2025", "2025-2026"]
split:
  fit_gw_max: 30
  cal_start: 31
  cal_end: 30            # empty calibration (no curation slice)
  test_start: 31         # source rows -> target GWs 32..38
  test_end: null

# Season-start (honest) benchmark: trained ONLY on seasons[0]. Note the runner
# maps this to source rows (targets are one GW later than the source windows);
# run with --season-start. Report: our cold model MAE 1.190 vs FPL ep_next
# 1.241 (2025-26 #GW1-5).
season_start:
  test_gw_max: 5

experiments:
  lgbm_all:
    model: lgbm
    note: full feature set
  lgbm_no_ep:
    model: lgbm
    features: [team_code, position, now_cost, had_match, was_home, opponent_elo,
               home_elo, pts_avg_3, pts_avg_5]
    note: drop FPL's own forecast (ep_next)
  lgbm_basic:
    model: lgbm
    features: [position, now_cost, pts_avg_3, pts_avg_5]
    note: only form + price
  hist_gb:
    model: hist_gb
    note: sklearn gradient boosting on full set
  ridge:
    model: ridge
    note: linear baseline on full set